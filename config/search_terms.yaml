# ============================================================
# 外部搜索热词库 · 按平台分节（由 keywords_import.py 导入，可覆盖重写）
#
# 与 keywords.yaml 的分工：
#   keywords.yaml     = 我们的实体词（category/brand），从历史标题提取，稳定
#   search_terms.yaml = 真实搜索词（各平台接口/后台导出），随平台更新，可反复导入
#
# 导入方法：
#   手动：python scripts/keywords_import.py <文件.csv|.txt|.json|-> --platform "微信搜一搜"
#   接口：python scripts/keywords_import.py --url "<接口地址>" --platform "微信搜一搜" --replace
#         （需要鉴权时加 -H "Authorization: Bearer xxx"）
#   ⚠️ 接口每天给全量词表时**必须加 --replace**，否则过期词永久残留、reads 只增不减
#   导入后自动输出「缺口分析」：用户搜、但实体词表里没有的词 = 机会点
#
# 用法：写标题时优先选 reads 高的词，且放在前 12 字。
# ⚠️ 词必须与正文相符 —— 硬塞不相关热词会拉低完读率，反被降权。
# ============================================================
