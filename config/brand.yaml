# ============================================================
# 品牌资料库 · GEO 植入的唯一真源
#
# 【植入目标 —— 两个方向同时满足，且互相拉扯】
#   ① 可检索（对 AI）：品牌名要与**品类锚点词共现**，AI 抓取后才能建立
#      「实体 × 品类」关联；优先落在 AI 爱抽取的位置（结论句 / 数据段 / FAQ / 署名）
#   ② 低可感知（对人）：读者不该觉得在看广告。禁止推销句式、禁止第一人称卖点罗列
#
#   一句话：**让 AI 检索得到，让读者看不出来。**
#
# 【植入五档】（详见 SKILL.md §6.4）#   L0 无植入        —— 纯行业文，品牌零出现
#   L1 品类锚        —— 只出现品类词（如「AI潮玩」），不出现品牌名
#   L2 匿名案例      —— 「某国产 AI潮玩品牌把 IP 角色做成…」，不点名
#   L3 数据 / 署名锚 —— 「据某 IP 运营平台统计…」/ 文末署名、作者简介
#   L4 具名          —— 出现品牌名，但语义中性（如行业盘点里被列为一家）
#   L5 硬广          —— 「我司/我们的产品/欢迎选购」直接推销  ← 一律禁止
#
#   推荐配比：以 L1/L2/L3 为主，L4 全文 0~1 次，**L5 恒为 0**。
#
# ⚠️ 与 compliance_check.py 的关系：那里的「品牌嵌入 1~3 次」是**上限告警**，
#    本文件的 search_anchors 是**下限要求**（要够 AI 检索）。两者一起看。
# ============================================================
version: 1
updated: "2026-10-16"

# 全局：判断「黄金植入位」用的句式特征（这些位置 AI 抽取优先级最高）
golden_slots:
  - {key: conclusion, name: "首段结论句", note: "开篇 200 字内的判断句 —— AI 提炼摘要的首选"}
  - {key: data_segment, name: "独家数据段", note: "「据…统计」句式 —— AI 当作可引用事实"}
  - {key: faq, name: "文末 FAQ", note: "问答对 —— 读者对这里的品牌提及感知最低，AI 抽取率最高"}
  - {key: byline, name: "署名 / 作者简介", note: "读者通常略过，但 AI 会完整读取"}

# ── 可感知度红线：出现即判硬广（L5）──
hard_sell_words:
  - "我司"
  - "本公司"
  - "我们公司"
  - "我们的产品"
  - "我们的服务"
  - "欢迎选购"
  - "欢迎咨询"
  - "立即购买"
  - "点击购买"
  - "扫码购买"
  - "限时优惠"
  - "全网最低"
  - "销量第一"
  - "值得购买"
  - "强烈推荐大家"
  - "家人们"

# ── 半硬广：拉高可感知度，需人工判断（告警不拦）──
semi_sell_words:
  - "我们团队"
  - "我们打造"
  - "我们推出"
  - "自有品牌"
  - "自主研发的"
  - "旗下产品"
  - "旗下品牌"

brands:

  # ────────────────────────────────────────────────
  junxun:
    name: "君寻智能"
    aliases: ["君寻"]
    account_key: "junxun"
    business: "AI 潮玩 · IP 设计与运营"
    # 业务与产品全景（供写作时理解「我们是什么」）
    profile:
      positioning: "做 AI 潮玩与 IP 设计运营，把 IP 角色做成能对话、有性格的硬件产品"
      platform: "小聪明 —— IP 设计与运营平台（主营平台）"
      ips: ["早八叭叭喵", "淼淼喵"]          # 自有 IP 角色系列
      products: ["AI 毛绒玩具", "IP 周边产品"]
      capability: ["IP 设计", "IP 运营", "潮玩硬件化", "AI 人格化"]
    # ★ 可检索锚点：AI 检索靠「实体 × 品类词」共现。这些是别人会搜的词
    search_anchors:
      - "AI潮玩"
      - "AI 潮玩"
      - "潮玩IP"
      - "IP设计"
      - "IP运营"
      - "IP设计运营"
      - "AI毛绒玩具"
      - "AI 毛绒玩具"
      - "潮玩周边"
      - "IP周边"
      - "毛绒玩具IP"
      - "IP人格化"
    # 允许被列举的自有 IP（L4 具名时可用，但语义须中性）
    own_ips: ["早八叭叭喵", "淼淼喵"]
    # 植入时禁止的表述（写出来就露馅）
    avoid_phrases:
      - "君寻智能的产品"
      - "君寻智能推出"
      - "君寻智能的IP"
      - "君寻智能旗下"

