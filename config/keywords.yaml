# ============================================================
# 搜索词库 · 标题生成时的选词依据
#
# 为什么要有它
#   两个号都是**服务号**，微信官方明确「推荐是订阅号的能力」→ 服务号永远拿不到推荐流量，
#   **搜一搜是唯一能自主争取的增量**（见 SKILL.md §6.1-C）。
#   标题前半段必须出现用户真会搜的**实体词**，而不是我们的修辞。
#
# 数据来源
#   ① 自动提取：我们自己 411 篇历史标题的高频实体（2026-10-02 首版，freq = 出现次数）
#   ② 待补充：**微信后台「搜一搜」搜索词报告**（最有用 —— 带真实阅读数据）
#   ③ 待补充：各平台搜索框下拉联想词 / 热搜榜
#
# 用法（写标题时）
#   1. 先从 category / brand 里选 1 个词放进标题**前 12 字**
#   2. 若某个词命中 search_terms（有真实搜索数据），优先用它，且排在更靠前
#   3. ⚠️ 词必须与正文实际内容相符 —— 硬塞不相关的热词会伤相关性、拉低完读率，反而被降权
# ============================================================
version: 1
updated: "2026-10-02"
source: "history.db 411 篇标题自动提取"

# ── 品类词：用户按「品类」搜索时用的词 ──
# 排序 = 我们自己标题里的出现频次（freq 越高 = 我们写得越多 = 该品类的内容资产越厚）
