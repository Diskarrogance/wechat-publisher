# ── 真实搜索词（★ 最有价值，待补充）──
# 来源：微信公众平台后台 → 数据 → 搜一搜 → 搜索词报告
# 格式示例（拿到数据后按此填写，按 reads 降序）：
# search_terms:
#   - {word: "AI玩具", reads: 0, source: "微信搜一搜"}
#   - {word: "陪伴机器人多少钱", reads: 0, source: "微信搜一搜"}
search_terms: []

# ── 搜索意图词（按平台特性区分，写标题时参考）──
# 微信搜一搜  → 信息型：XX是什么 / XX怎么样 / XX多少钱
# 今日头条    → 资讯型：事件、热点、谁做了什么
# 小红书      → 决策型：XX推荐 / XX怎么选 / XX避坑
intent_hint:
  微信搜一搜: ["是什么", "怎么样", "多少钱", "哪款好"]
  今日头条: ["官宣", "发布", "卖爆", "背后"]
  小红书: ["推荐", "怎么选", "避坑", "平替"]
