  - {word: "智能体", freq: 7}
  - {word: "算力", freq: 6}
  - {word: "手办", freq: 4}
  - {word: "挂件", freq: 3}
  - {word: "具身智能", freq: 2}
  - {word: "AI眼镜", freq: 2}
